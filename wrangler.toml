# Saif Tech Global LLC — Cloudflare Pages project "saiftechglobal"
# Company Service Infrastructure (Working Mode + Centralized 24/7 Helpline + Admin).
# Completely independent of SG16 Central Brain: no binding, URL or key of that project is used here.
#
# Before the first production deploy, follow docs/working-mode/SETUP.md:
#   1. `npx wrangler d1 create stg-company-db` and paste the returned database_id below.
#   2. Apply migrations, add secrets, configure Cloudflare Access for /admin and /api/admin.

name = "saiftechglobal"
pages_build_output_dir = "."
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "stg-company-db"
database_id = "ae1e0668-afc1-4d23-9514-78955aa051d5"
migrations_dir = "migrations"

[ai]
binding = "AI"

# Build runner Worker (runner/wrangler.toml) — AI build/test/retry/refund loop with the container sandbox.
[[services]]
binding = "RUNNER"
service = "stg-company-runner"

[vars]
# "test" uses https://test.dodopayments.com, "live" uses https://live.dodopayments.com
DODO_MODE = "live"
EMAIL_FROM = "Saif Tech Global LLC <no-reply@saiftechglobal.com>"
# Cloudflare Access (Zero Trust) — protects /admin and /api/admin. Fill in after setup.
ACCESS_TEAM_DOMAIN = "sg16global.cloudflareaccess.com"
ACCESS_AUD = "e96732c00ed55e026c7126ef45d9ef51f501ee5187e556c24a7d408fd11f2ea4"
# Comma-separated owner emails; they always get the "owner" role in the Admin Panel.
OWNER_EMAILS = "sg16global@gmail.com"

# Secrets (never put these in this file — add with `wrangler pages secret put <NAME>`):
#   DODO_API_KEY, DODO_WEBHOOK_SECRET, DODO_PRODUCT_ID, RESEND_API_KEY, PLATFORM_SIGNING_KEYS, RUNNER_SECRET
