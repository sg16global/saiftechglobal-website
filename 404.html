<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - Saif Tech Global LLC</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#030308" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #030308;
        color: #f2f4f8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 560px; }
      .code {
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #7cfc00;
        font-weight: 700;
      }
      h1 {
        margin: 14px 0 10px;
        font-size: clamp(24px, 5.5vw, 36px);
        line-height: 1.2;
      }
      p {
        margin: 0 0 26px;
        color: #9aa4b2;
        line-height: 1.65;
      }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid #2a2f3a;
        color: #f2f4f8;
      }
      a.primary { background: #7cfc00; border-color: #7cfc00; color: #04170a; }
      a:focus-visible { outline: 2px solid #7cfc00; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">Error 404</div>
      <h1>This page could not be found.</h1>
      <p>The address may be mistyped, or the page has moved.</p>
      <div class="actions">
        <a class="primary" href="/">Return home</a>
        <a href="/privacy">Privacy</a>
      </div>
    </main>
  </body>
</html>
